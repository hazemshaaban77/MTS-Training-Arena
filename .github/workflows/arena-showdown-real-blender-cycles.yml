name: Blender Cycles • Arena Showdown Art Review (NO DEPLOY)
on:
  push:
    branches:
      - tools/arena-showdown-blender-cycles
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Install actual Blender renderer (Ubuntu universe package)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Confirm source or use safe CPU calibration
        run: |
          if [ -f tools/arena-showdown-cycles/models/Arena_Showdown_Stage1_v3.glb ]; then
            echo "Rendering the exact owner-reviewed GLB"
          else
            echo "::notice::GLB not yet staged in the tools branch. Calibration render only; DO NOT label as Arena visual approval."
          fi
      - name: Real CPU Cycles render (no web server, no deployment)
        working-directory: tools/arena-showdown-cycles
        run: blender -b -t 2 --python scripts/render_cycles.py
      - name: Publish render images and editable scene as CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-showdown-real-blender-cycles-review
          path: tools/arena-showdown-cycles/renders/
          if-no-files-found: warn
          retention-days: 14
