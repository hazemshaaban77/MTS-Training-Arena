name: Arena Showdown STAGE 1 / Final Real 3D Hero Review
on:
  push:
    branches: [feature/arena-showdown-stage1-final-hero-art]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  art-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Verify original V3 GLB is unchanged
        run: |
          set -euo pipefail
          cd tools/arena-showdown-cycles/models
          echo "c5104ded9cfb0714bf74a89fcaf59adf4d905e3a8952560c96c9accb0f8873ba  Arena_Showdown_Stage1_v3.glb" | sha256sum -c -
          test "$(wc -c < Arena_Showdown_Stage1_v3.glb)" -eq 2787288
      - name: Download official Blender 4.5.15 LTS x64 and verify publisher checksum
        run: |
          set -euo pipefail
          mkdir -p .blender
          cd .blender
          curl -fLSs --retry 3 --retry-delay 3 -o blender.tar.xz https://download.blender.org/release/Blender4.5/blender-4.5.15-linux-x64.tar.xz
          curl -fLSs --retry 3 --retry-delay 3 -o release.sha256 https://download.blender.org/release/Blender4.5/blender-4.5.15.sha256
          grep 'blender-4.5.15-linux-x64.tar.xz' release.sha256 | sed 's@blender-4.5.15-linux-x64.tar.xz@blender.tar.xz@' | sha256sum -c -
          tar -xf blender.tar.xz
          BIN="$(find "$PWD" -type f -name blender -executable -print -quit)"
          test -n "$BIN"
          "$BIN" --version | head -n 3
          "$BIN" -b --python-expr "import numpy; print('BUNDLED_NUMPY_OK')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Cairo Arabic sector textures and real-world studio media assets
        run: |
          set -euo pipefail
          python -m pip install --quiet Pillow
          python tools/arena-showdown-cycles/scripts/prepare_hero_assets.py
          mkdir -p tools/arena-showdown-cycles/art_assets
          curl -fLSs --retry 2 --max-time 45 -o tools/arena-showdown-cycles/art_assets/studio_small_01_1k.hdr \
            https://dl.polyhaven.org/file/ph-assets/HDRIs/hdr/1k/studio_small_01_1k.hdr \
            || echo "::warning::CC0 Poly Haven studio HDRI unavailable. Physical softbox lighting will be used."
      - name: Render authentic final 3D Stage 1 HERO and verify Blender outputs
        working-directory: tools/arena-showdown-cycles
        run: |
          set -uo pipefail
          mkdir -p renders
          BIN="$(find "$GITHUB_WORKSPACE/.blender" -type f -name blender -executable -print -quit)"
          test -n "$BIN" || exit 1
          set +e
          ARENA_PREMIUM_STAGE1=1 ARENA_FINAL_HERO=1 ARENA_ART_SINGLE_FRAME=1 "$BIN" -b -t 2 --python scripts/render_cycles.py 2>&1 | tee renders/premium_cycles.log
          code=${PIPESTATUS[0]}
          set -e
          grep -q 'STAGE1_FINAL_HERO_REAL_3D_COMPLETE' renders/premium_cycles.log || { echo "::error::Art geometry step not executed"; exit 1; }
          grep -q 'ARENA_CYCLES_COMPLETE: ART_V5_REAL_MODEL' renders/premium_cycles.log || { echo "::error::Incomplete actual V4 render, Blender exit $code"; exit 1; }
          file "renders/Arena_Showdown_Stage1_Final_Hero.png" | grep -q 'PNG image data, 1440 x 810' || { echo "::error::Premium Hero PNG missing or invalid dimensions"; exit 1; }
          test -s renders/Arena_Showdown_Stage1_Final_Hero.blend || exit 1
          test "$(head -c 7 renders/Arena_Showdown_Stage1_Final_Hero.blend)" = "BLENDER" || exit 1
          echo "ARENA_STAGE1_FINAL_HERO_ACTUAL_CYCLES_FRAME_VERIFIED=1"
      - name: Save visual evidence and editable scene, even on errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-showdown-stage1-final-hero-authentic-review
          path: tools/arena-showdown-cycles/renders/
          retention-days: 14
          if-no-files-found: warn
