name: Deploy MTS Training Arena to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify independent Arena entry point
        run: |
          test -f index.html
          test -f firebase-config.js
          test -f arena/live.html
          test -f arena/live.mjs
          test -f mts.png
          test -f training.png
      - name: Build public files only
        run: |
          mkdir -p public/arena
          cp index.html firebase-config.js mts.png training.png public/
          cp arena/*.html arena/*.js arena/*.mjs arena/*.css public/arena/
          rm -f public/arena/*test.mjs
          touch public/.nojekyll
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
