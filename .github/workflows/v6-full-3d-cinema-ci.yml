name: Arena V6 Cinema 3D — full stage regression
on:
  push:
    branches: ['feature/v6-full-3d-arena-stage']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Validate all arena roles, scoring, and real WebGL stage
        run: pnpm test
      - name: Validate game overhauls and creative identity
        run: |
          node scripts/verify-game-overhaul.mjs
          node scripts/verify-creative-identity.mjs
      - name: Build V6 frontend, not deploy
        env:
          VITE_ARENA_API_ORIGIN: https://mts-training-arena-v6-gateway.pages.dev
        run: pnpm run build:github
      - name: Validate Worker compilation, not deploy
        run: pnpm run build:github-api
