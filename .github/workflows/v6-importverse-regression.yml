name: V6 ImportVerse Session and Gameplay Regression
on:
  push:
    branches: ['feature/v6-importverse-session-and-gameplay-fixes']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-importverse-session.mjs
      - run: node scripts/verify-game-overhaul.mjs
      - run: pnpm test
      - run: pnpm run build:github
        env:
          VITE_ARENA_API_ORIGIN: https://mts-training-arena-v6-gateway.pages.dev
      - run: pnpm run build:github-api
      - run: pnpm exec wrangler deploy --config wrangler.github.toml --dry-run --outdir dist-importverse-test
