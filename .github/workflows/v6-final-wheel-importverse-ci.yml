name: V6 final wheel and ImportVerse episode-backed regression
on:
  push:
    branches: ['feature/v6-final-wheel-projector-flashcards']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: node scripts/verify-game-overhaul.mjs
      - run: node scripts/verify-creative-identity.mjs
      - run: pnpm run build:github
        env:
          VITE_ARENA_API_ORIGIN: https://mts-training-arena-v6-gateway.pages.dev
      - run: pnpm run build:github-api
      - name: Compile the verified trainer draft and question bank
        run: |
          pnpm exec esbuild scripts/export-importverse-workshop.ts --bundle --platform=node --format=esm --outfile=/tmp/v6-importverse-export.mjs
          node /tmp/v6-importverse-export.mjs
      - name: Preserve tested Worker and workshop snapshot for deployment
        working-directory: .
        run: |
          cp work-site-recovery-v6/dist-github-api/worker.mjs deployment-bundles/v6/worker.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-bundles/v6/worker.mjs deployment-bundles/v6/importverse-draft.json deployment-bundles/v6/importverse-question-bank.json
          if ! git diff --cached --quiet; then
            git commit -m "build(v6): verified trainer workshop snapshot and Worker [skip ci]"
            git push origin HEAD:feature/v6-final-wheel-projector-flashcards
          fi
