name: Arena E2 Sprint05 real API isolated staging E2E (NO DEPLOY)
on:
  push:
    branches:
      - feature/arena-e2-staging-e2e-20261104
      - feature/arena-e2-per-activity-reveal-20261104
      - feature/arena-e2-approved-brand-stage-20261104
      - feature/arena-e2-luxury-crown-wheel-20261105
      - work/arena-e2-integration-audit-20261105
    paths:
      - "work-site-recovery-v6/e2-staging-qa/**"
      - "work-site-recovery-v6/public/e2-preview/**"
      - "work-site-recovery-v6/lib/**"
      - "work-site-recovery-v6/components/arena/**"
      - "work-site-recovery-v6/tests/**"
      - "work-site-recovery-v6/scripts/**"
      - "work-site-recovery-v6/github-api-worker.ts"
      - "work-site-recovery-v6/wrangler.e2-staging.toml"
      - "work-site-recovery-v6/vite.github.config.ts"
      - ".github/workflows/arena-e2-staging-e2e.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ephemeral-v6-real-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - name: Checkout isolated E2E branch (no deployment credentials)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install pinned pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11.25.0"
      - name: Install dependencies in disposable CI runner
        run: pnpm install --frozen-lockfile
      - name: Verify all baseline V6 TypeScript, authorization and score tests
        run: pnpm test
      - name: Verify staged projection safe contract
        run: node --test e2-staging-qa/public-stage.test.mjs
      - name: Build frontend locally, never publish
        run: pnpm run build:github
        env:
          # Same-origin on loopback; production client rejects insecure configured API origins.
          VITE_ARENA_API_ORIGIN: ""
      - name: Build isolated locked E2 staging frontend for verification only
        run: pnpm run build:github
        env:
          ARENA_E2_STAGING_BUILD: "1"
          VITE_ARENA_STAGE: "e2-staging"
          VITE_ARENA_STAGING_AUTH_MODE: "existing-v6"
          VITE_ARENA_API_ORIGIN: "https://mts-training-arena-e2-staging.pages.dev"
      - name: Verify E2 Pages gateway routes and pinned emergency asset rewrite
        run: node --test e2-staging-qa/pages-gateway.test.mjs
      - name: Verify staging and production frontend outputs remain separate
        run: |
          test -s dist-github/index.html
          test -s dist-e2-staging/index.html
          test -s dist-e2-staging/assets/$(find dist-e2-staging/assets -maxdepth 1 -type f -name 'index-*.js' -printf '%f\n' | head -n 1)
          grep -q 'assets/' dist-e2-staging/index.html
          grep -q 'mts-training-arena-e2-staging.pages.dev' dist-e2-staging/assets/index-*.js
          if grep -q 'mts-training-arena-e2-staging-api.hazem-mts-arena.workers.dev' dist-e2-staging/assets/index-*.js; then
            echo "FAIL: E2 production JS still points to workers.dev"; exit 1
          fi
          echo "PASS: isolated staging bundle compiled without publishing or overwriting the V6 bundle."
      - name: Verify realtime notification contract without production WebSockets
        run: node scripts/verify-live.mjs
      - name: Build isolated V6 API Worker bundle (never deploy)
        run: pnpm run build:github-api
      - name: Verify the compiled staging Worker denies production Firebase and media writes
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import worker from './dist-github-api/worker.mjs';
          const stageOrigin='https://mts-training-arena-e2-staging.pages.dev';
          const db={prepare:()=>({first:async()=>({name:'sessions'})})};
          const env={ARENA_DEPLOYMENT:'e2-staging',ARENA_STAGING_LOCK:'locked',
            ARENA_PUBLIC_ORIGIN:stageOrigin,DB:db};
          const call=async(path,method='GET',settings=env)=>{
            const request=new Request('https://arena-e2-stage.example'+path,{method,
              headers:{Origin:stageOrigin}});
            const response=await worker.fetch(request,settings);
            return {status:response.status,body:await response.json()};
          };
          const health=await call('/api/staging-health');
          assert.equal(health.status,200);
          assert.deepEqual(health.body,{stage:'e2-staging',locked:true,databaseSchemaReady:true});
          for(const path of ['/api/me','/api/sessions','/api/media-sign','/api/auth-health']){
            const response=await call(path);
            assert.equal(response.status,503,path);
            assert.equal(response.body.error,'STAGING_LOCKED',path);
          }
          const writes=await call('/api/sessions','POST');
          assert.equal(writes.status,503);
          const wrong=await worker.fetch(new Request('https://arena-e2-stage.example/api/staging-health'),
            {...env,ARENA_PUBLIC_ORIGIN:'https://hazemshaaban77.github.io'});
          assert.equal(wrong.status,503);
          assert.equal((await wrong.json()).error,'STAGING_CONFIGURATION_INVALID');
          const ready={...env,ARENA_STAGING_LOCK:'ready',ARENA_STAGING_AUTH_MODE:'existing-v6'};
          const prepared=await call('/api/staging-health','GET',ready);
          assert.equal(prepared.status,200);
          assert.equal(prepared.body.locked,false);
          // Shared production login does NOT grant a role without a signed
          // Firebase token and membership in the existing trainer allowlist.
          const noTrainer=await call('/api/me','GET',ready);
          assert.equal(noTrainer.status,200);
          assert.equal(noTrainer.body.authenticated,false);
          for(const path of ['/api/media-sign','/api/media-upload','/api/admin'])assert.equal((await call(path,'POST',ready)).status,403);
          const isolatedMode={...ready,ARENA_STAGING_AUTH_MODE:'isolated'};
          const missing=await call('/api/me','GET',isolatedMode);
          assert.equal(missing.status,503);
          assert.equal(missing.body.error,'STAGING_FIREBASE_NOT_CONFIGURED');
          const isolated={projectId:'mts-arena-e2-testing',apiKey:'AIza'+'x'.repeat(35),authDomain:'mts-arena-e2-testing.firebaseapp.com',databaseURL:'https://mts-arena-e2-testing-default-rtdb.europe-west1.firebasedatabase.app'};
          isolatedMode.ARENA_STAGING_FIREBASE_CONFIG=JSON.stringify(isolated);
          const isolatedReady=await call('/api/staging-health','GET',isolatedMode);
          assert.equal(isolatedReady.status,200);
          assert.equal(isolatedReady.body.locked,false);
          console.log('PASS: compiled E2 Worker is isolated and locked; no network or production writes.');
          JS
      - name: Verify frontend, API and brand preview artifacts
        run: |
          test -s dist-github/index.html
          test -s dist-github-api/worker.mjs
          test -s dist-github/e2-preview/index.html
          test -s dist-github/e2-preview/live-projector.html
          test -s dist-github/e2-preview/live-projector.mjs
          test -s dist-github/e2-preview/assets/arena-logo-approved.png
          test -s dist-github/e2-preview/assets/arena-logo-safe-margin.png
          echo "PASS: local frontend/API and E2 assets exist; none deployed."
      - name: Bundle local V6 API handler with ephemeral SQLite transport
        run: |
          mkdir -p .sites-runtime/e2-staging-qa
          pnpm exec esbuild e2-staging-qa/staging-local-server.ts --bundle --platform=node --format=esm --target=node24 --outfile=.sites-runtime/e2-staging-qa/staging-local-server.mjs
      - name: Install isolated Chromium browser without touching pnpm dependencies
        run: |
          mkdir -p "$RUNNER_TEMP/e2-playwright"
          npm --prefix "$RUNNER_TEMP/e2-playwright" install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          ln -s "$RUNNER_TEMP/e2-playwright/node_modules/playwright" node_modules/playwright
          node "$RUNNER_TEMP/e2-playwright/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Launch local read-only frontend preview for browser visual regressions
        run: |
          python3 -m http.server 8087 --bind 127.0.0.1 --directory dist-github >/tmp/arena-e2-visual.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8087/e2-preview/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/arena-e2-visual.log
          exit 1
      - name: Test 2D lobby intro boxes scoreboard and mobile visual prototype
        run: node e2-staging-qa/browser-qa.mjs
      - name: Test read-only projector privacy and link hygiene on Chromium
        run: node e2-staging-qa/live-projector-qa.mjs
      - name: Run two then five independent browser clients and projector against real API handler
        run: node e2-staging-qa/real-session-browser.mjs
      - name: Verify manual and automatic cinematic reveal in original V6 React projector
        run: node e2-staging-qa/reveal-ui-browser.mjs
      - name: Test Wheel Challenge Card signed grade and projector privacy on real V6
        run: node e2-staging-qa/luxury-wheel-browser.mjs --challenge
      - name: Test licensed Sci-Fi Crate in fresh Chromium GPU and disposable API
        run: node e2-staging-qa/luxury-wheel-browser.mjs --crate
      - name: Test premium 3D wheel with isolated disposable API and Chromium
        run: node e2-staging-qa/luxury-wheel-browser.mjs --wheel
      - name: Package reviewed E2 staging frontend for direct Cloudflare Pages upload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mts-arena-e2-staging-pages-ready
          path: work-site-recovery-v6/dist-e2-staging/
          retention-days: 3
          if-no-files-found: error
      - name: Archive only screenshot evidence (no database, secrets or participant tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-e2-sprint05-ephemeral-real-api-e2e
          path: work-site-recovery-v6/e2-staging-qa/ci-screenshots/
          retention-days: 5
          if-no-files-found: ignore
