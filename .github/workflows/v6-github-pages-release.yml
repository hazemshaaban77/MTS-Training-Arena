name: Release MTS Training Arena V6 on GitHub Pages
on:
  push:
    branches: ['develop/v6-github-arena']
    paths: ['deployments/v6-release-request.txt']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  v6-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - name: Check isolated Cloudflare Free backend
        run: |
          set -euo pipefail
          curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error "https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev/api/me" | jq -e '.authenticated == false'
          curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error "https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev/api/branding" | jq -e '.mts and .training'
      - name: Test and build the same Version 6 source
        working-directory: work-site-recovery-v6
        env:
          VITE_ARENA_API_ORIGIN: https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build:github
      - name: Preserve legacy GitHub Pages pilot and add /v6/
        run: |
          mkdir -p pages-site/v6
          cp index.html firebase-config.js mts.png training.png pages-site/
          cp -R arena pages-site/
          cp -R work-site-recovery-v6/dist-github/. pages-site/v6/
          touch pages-site/.nojekyll
          test -s pages-site/v6/index.html
          test -s pages-site/arena/projector.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site
      - id: deployment
        uses: actions/deploy-pages@v4
