name: V6 Cinematic Entrance B — Cairo/dynamic wheel review
on:
  push:
    branches: ['feature/v6-cinematic-b-cairo-dynamic-wheel']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Full V6 regression and visual-contract tests
        run: pnpm test
      - name: Game and brand invariants
        run: |
          node scripts/verify-game-overhaul.mjs
          node scripts/verify-creative-identity.mjs
      - name: Frontend production bundle (never publish)
        run: pnpm run build:github
        env:
          VITE_ARENA_API_ORIGIN: https://mts-training-arena-v6-gateway.pages.dev
      - name: Backend source build regression (never deploy)
        run: pnpm run build:github-api
