name: V6 GitHub migration checks
on:
  push:
    branches: ['develop/v6-github-arena']
    paths:
      - 'work-site-recovery-v6/**'
      - '.github/workflows/v6-github-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check-v6:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work-site-recovery-v6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - name: Existing V6 service, auth and rendering tests
        run: pnpm test
      - name: Compile the Github Pages React client
        run: pnpm run build:github
        env:
          VITE_ARENA_API_ORIGIN: ${{ vars.ARENA_V6_API_ORIGIN }}
      - name: Bundle the standalone Cloudflare backend
        run: pnpm run build:github-api
      - name: Validate Durable Object migration and Worker bindings with Wrangler
        run: pnpm exec wrangler deploy --config wrangler.github.toml --dry-run --outdir dist-github-dry-run
      - name: Validate built static and worker files
        run: |
          test -s dist-github/index.html
          test -s dist-github-api/worker.mjs
          test -d dist-github/assets
      - name: Save reviewed Worker bundle in separate development path
        working-directory: .
        run: |
          mkdir -p deployment-bundles/v6
          cp work-site-recovery-v6/dist-github-api/worker.mjs deployment-bundles/v6/worker.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployment-bundles/v6/worker.mjs
          if ! git diff --cached --quiet; then
            git commit -m "Build v6 Worker bundle from verified source [skip ci]"
            git push origin HEAD:develop/v6-github-arena
          fi
      - name: Smoke-test isolated live Cloudflare Worker without credentials
        run: |
          set -euo pipefail
          api="https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev"
          curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error "$api/api/me" | jq -e '.authenticated == false and .provider == "firebase"'
          curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error "$api/api/branding" | jq -e '.mts and .training'
          curl --retry 3 --retry-delay 2 --fail-with-body --silent --show-error -X OPTIONS -H "Origin: https://hazemshaaban77.github.io" -H "Access-Control-Request-Method: POST" "$api/api/join" > /dev/null
      - name: Probe deployed Firebase and Cloudflare dependencies
        run: |
          set -euo pipefail
          endpoint="https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev/api/auth-health"
          curl --retry 3 --retry-delay 2 --silent --show-error --fail-with-body "$endpoint" | tee /tmp/arena-v6-auth-health.json
          jq -e '.googleKeys == "reachable" and .firebaseDatabase == "reachable" and .appDatabase == "ready"' /tmp/arena-v6-auth-health.json
      - name: Verify browser trainer auth preflight and CORS on Cloudflare
        run: |
          set -euo pipefail
          api="https://mts-training-arena-v6-api.hazem-mts-arena.workers.dev/api/me"
          origin="https://hazemshaaban77.github.io"
          code=$(curl -sS -D /tmp/v6-preflight-headers -o /dev/null -w '%{http_code}' -X OPTIONS "$api" -H "Origin: $origin" -H "Access-Control-Request-Method: GET" -H "Access-Control-Request-Headers: x-firebase-token")
          test "$code" = "204"
          grep -qi "^access-control-allow-origin: $origin" /tmp/v6-preflight-headers
          grep -qi 'x-firebase-token' /tmp/v6-preflight-headers
          code=$(curl -sS -D /tmp/v6-auth-headers -o /tmp/v6-auth-body -w '%{http_code}' "$api" -H "Origin: $origin" -H "X-Firebase-Token: arena-connection-test")
          test "$code" = "401"
          grep -qi "^access-control-allow-origin: $origin" /tmp/v6-auth-headers
          jq -e '.error == "INVALID_TOKEN"' /tmp/v6-auth-body
      - name: Check public GitHub Pages V6 asset delivery
        run: |
          set -euo pipefail
          page="https://hazemshaaban77.github.io/MTS-Training-Arena/v6/"
          curl --retry 4 --retry-delay 4 --fail-with-body --silent --show-error "$page" > /tmp/arena-v6.html
          grep -q 'id="arena-root"' /tmp/arena-v6.html
          grep -q '/MTS-Training-Arena/v6/assets/' /tmp/arena-v6.html
      - uses: actions/upload-artifact@v4
        with:
          name: mts-arena-v6-worker-bundle
          path: work-site-recovery-v6/dist-github-api/worker.mjs
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: mts-arena-v6-frontend-preview
          path: work-site-recovery-v6/dist-github/
          retention-days: 7
