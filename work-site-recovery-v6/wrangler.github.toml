# Separate worker for the Version 6 GitHub Pages frontend.
# Do not deploy until the isolated D1 database is provisioned and UUID replaced.
name = "mts-training-arena-v6-api"
main = "github-api-worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ARENA_PUBLIC_ORIGIN = "https://hazemshaaban77.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mts-training-arena-v6"
database_id = "35e417b9-1a99-46a8-8d00-5f88a79db756"

# Cloudinary Free (image/video) uses a server-side signature, not R2 storage.
# Configure CLOUDINARY_CLOUD_NAME and CLOUDINARY_API_KEY as plain-text Worker vars,
# and CLOUDINARY_API_SECRET as a Worker SECRET (never in GitHub or Vite builds).
# Until all three are configured, /api/media-sign returns CLOUDINARY_NOT_CONFIGURED.
# Existing public HTTPS references continue to work. No purchase/billing needed from this deploy.
# R2 remains disabled.

# Workers Free supports SQLite-backed Durable Objects and hibernating WebSockets.
# Each six-digit room gets an isolated ephemeral event channel; D1 stays authoritative.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "ArenaLiveRoom"

[[migrations]]
tag = "arena-live-v1"
new_sqlite_classes = ["ArenaLiveRoom"]
