# Separate worker for the Version 6 GitHub Pages frontend.
# Do not deploy until the isolated D1 database is provisioned and UUID replaced.
name = "mts-training-arena-v6-api"
main = "github-api-worker.ts"
compatibility_date = "2026-05-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
ARENA_PUBLIC_ORIGIN = "https://hazemshaaban77.github.io"

[[d1_databases]]
binding = "DB"
database_name = "mts-training-arena-v6"
database_id = "35e417b9-1a99-46a8-8d00-5f88a79db756"

# R2 is not enabled on the Free account. Keep uploads disabled to avoid billing.
# Activities can still show HTTPS image and video references.
# Add an R2 binding only after the account owner explicitly approves it.

# Workers Free supports SQLite-backed Durable Objects and hibernating WebSockets.
# Each six-digit room gets an isolated ephemeral event channel; D1 stays authoritative.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "ArenaLiveRoom"

[[migrations]]
tag = "arena-live-v1"
new_sqlite_classes = ["ArenaLiveRoom"]
