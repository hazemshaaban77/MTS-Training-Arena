name: Integrated Arena checks
on:
  push:
    branches: ['feature/arena-integrated-private-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service-and-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: node scripts/verify-arena.mjs
